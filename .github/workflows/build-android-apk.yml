name: Build Makhzani POS V8.6 Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract V8.6 project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -type f -name '*.zip' | grep -E 'V8_6.*(GitHub_Ready|Android_APK_Ready|CloudSync)' | head -n 1 || true)
          if [ -z "$ZIP_FILE" ]; then
            echo 'لم أجد ملف مشروع V8.6 ZIP في المستودع.'
            find . -maxdepth 2 -type f | head -80
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/makhzani-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/makhzani-source"
          ROOT=$(find "$RUNNER_TEMP/makhzani-source" -name pnpm-workspace.yaml -printf '%h\n' | head -n 1)
          if [ -z "$ROOT" ] || [ ! -f "$ROOT/artifacts/makhzani-pos/package.json" ]; then
            echo 'لم يتم العثور على ملفات مشروع Makhzani POS داخل ZIP.'
            find "$RUNNER_TEMP/makhzani-source" -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.8.1 --activate

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}/artifacts/makhzani-pos
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/artifacts/makhzani-pos/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Makhzani-POS-V8.6-Android-APK
          path: ${{ env.PROJECT_DIR }}/artifacts/makhzani-pos/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

