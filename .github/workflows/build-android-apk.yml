
name: Build Makhzani POS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Show repository structure
        shell: bash
        run: |
          echo "===== ROOT ====="
          pwd
          ls -la
          echo "===== PACKAGE FILES ====="
          find . -name package.json \
            -not -path '*/node_modules/*' \
            -not -path '*/.git/*' || true

      - name: Find application folder
        id: locate
        shell: bash
        run: |
          FILE=$(find . -name package.json \
            -not -path '*/node_modules/*' \
            -not -path '*/.git/*' \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: No package.json found."
            echo "The application source files may not be uploaded."
            find . -maxdepth 5 -type f | head -250
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "app_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Application folder: $DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --no-frozen-lockfile
          else
            echo "No pnpm-lock.yaml found; installing from package.json"
            pnpm install --no-frozen-lockfile
          fi

      - name: Check Expo project
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: |
          node -e "const p=require('./package.json'); console.log('Project:',p.name || 'Makhzani POS')"
          pnpm exec expo --version

      - name: Generate Android project
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: pnpm exec expo prebuild --platform android --non-interactive

      - name: Build Android APK
        working-directory: ${{ steps.locate.outputs.app_dir }}/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Makhzani-POS-Android-APK
          path: ${{ steps.locate.outputs.app_dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
