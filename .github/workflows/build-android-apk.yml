

name: Makhzani POS V8.7 - Android Release

on:
  push:
    branches:
      - makhzani-v86-source-work
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source tree
        run: |
          set -e
          test -f v86-source/package.json
          test -f v86-source/pnpm-workspace.yaml
          test -f v86-source/artifacts/makhzani-pos/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
          run_install: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: v86-source
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android project
        working-directory: v86-source/artifacts/makhzani-pos
        env:
          CI: '1'
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Update dependencies after prebuild
        working-directory: v86-source
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android JavaScript bundle
        working-directory: v86-source/artifacts/makhzani-pos
        env:
          CI: '1'
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res

          pnpm exec expo export:embed \
            --platform android \
            --dev false \
            --reset-cache \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

          test -s android/app/src/main/assets/index.android.bundle

      - name: Build Release APK
        working-directory: v86-source/artifacts/makhzani-pos/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          APK="v86-source/artifacts/makhzani-pos/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          unzip -Z1 "$APK" | grep -q 'assets/index.android.bundle'

          echo "APK and JavaScript bundle verified"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Makhzani-POS-V8.7-Standalone-APK
          path: v86-source/artifacts/makhzani-pos/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
