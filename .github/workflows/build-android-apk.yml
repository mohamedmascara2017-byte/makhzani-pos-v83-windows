
name: Build Makhzani POS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'artifacts/makhzani-pos/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android project
        working-directory: artifacts/makhzani-pos
        run: pnpm exec expo prebuild --platform android --non-interactive

      - name: Build APK
        working-directory: artifacts/makhzani-pos/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Makhzani-POS-V8.7-Android-APK
          path: artifacts/makhzani-pos/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
