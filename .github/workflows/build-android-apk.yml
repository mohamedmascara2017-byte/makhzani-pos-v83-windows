
name: Build Makhzani POS V8.7 Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V8.7 source
        run: |
          ZIP="Makhzani_POS_V8_7_GitHub_APK_Build.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: V8.7 ZIP file not found!"
            ls -la
            exit 1
          fi

          mkdir -p source
          unzip -o "$ZIP" -d source

          if [ ! -f "source/package.json" ]; then
            echo "ERROR: package.json missing after extraction"
            find source -name package.json
            exit 1
          fi

          if [ ! -f "source/artifacts/makhzani-pos/package.json" ]; then
            echo "ERROR: Android app package.json missing"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install project dependencies
        working-directory: source
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android project
        working-directory: source/artifacts/makhzani-pos
        run: pnpm exec expo prebuild --platform android --non-interactive

      - name: Build APK
        working-directory: source/artifacts/makhzani-pos/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Makhzani-POS-V8.7-APK
          path: source/artifacts/makhzani-pos/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
