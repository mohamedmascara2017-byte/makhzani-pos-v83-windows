
name: Build Makhzani POS V8.7 Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V8.7 source
        shell: bash
        run: |
          ZIP="Makhzani_POS_V8_7_GitHub_APK_Build.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: V8.7 ZIP file not found!"
            ls -la
            exit 1
          fi

          mkdir -p source
          unzip -o "$ZIP" -d source

          echo "Checking project files..."

          if [ ! -f source/package.json ]; then
            echo "ERROR: Root package.json not found"
            find source -name package.json
            exit 1
          fi

          if [ ! -f source/artifacts/makhzani-pos/package.json ]; then
            echo "ERROR: Android app package.json not found"
            find source -name package.json
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: source
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android project
        working-directory: source/artifacts/makhzani-pos
        shell: bash
        run: |
          CI=1 pnpm exec expo prebuild --platform android --no-install

      - name: Install updated dependencies
        working-directory: source
        run: pnpm install --no-frozen-lockfile

      - name: Verify Android project
        shell: bash
        run: |
          test -f source/artifacts/makhzani-pos/android/gradlew
          test -f source/artifacts/makhzani-pos/android/app/build.gradle
          echo "Android project is ready."

      - name: Build standalone Release APK
        working-directory: source/artifacts/makhzani-pos/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Check APK
        shell: bash
        run: |
          APK="source/artifacts/makhzani-pos/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated"
            find source/artifacts/makhzani-pos/android/app/build/outputs -type f
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Makhzani-POS-V8.7-Release-APK
          path: source/artifacts/makhzani-pos/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
