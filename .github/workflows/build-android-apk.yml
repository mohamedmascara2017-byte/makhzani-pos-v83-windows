
name: Build Makhzani POS Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate package.json
        id: locate
        shell: bash
        run: |
          FILE=$(find . -name package.json -not -path '*/node_modules/*' | grep '/artifacts/makhzani-pos/package.json' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: artifacts/makhzani-pos/package.json not found"
            find . -maxdepth 4 -name package.json
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "app_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Found app at $DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android project
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: pnpm exec expo prebuild --platform android --non-interactive

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.app_dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Makhzani-POS-V8.7-Android-APK
          path: ${{ steps.locate.outputs.app_dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
