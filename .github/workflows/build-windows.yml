name: Build Makhzani POS for Windows

"on":
  workflow_dispatch:
  push:
    paths:
      - "Makhzani_POS_V8_4_Windows_Variants_Reports_DriveBackup.zip"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Extract the Windows project ZIP
        shell: pwsh
        run: |
          $sourceZip = "Makhzani_POS_V8_4_Windows_Variants_Reports_DriveBackup.zip"
          if (!(Test-Path -LiteralPath $sourceZip)) {
            throw "لم أجد ملف المشروع: $sourceZip. ارفع ملف ZIP إلى جذر المستودع بالاسم نفسه."
          }
          if (Test-Path -LiteralPath "source") { Remove-Item -LiteralPath "source" -Recurse -Force }
          New-Item -ItemType Directory -Path "source" | Out-Null
          Expand-Archive -LiteralPath $sourceZip -DestinationPath "source" -Force
          if (!(Test-Path -LiteralPath "source/package.json") -or !(Test-Path -LiteralPath "source/pnpm-lock.yaml") -or !(Test-Path -LiteralPath "source/pnpm-workspace.yaml")) {
            throw "ملف ZIP لا يحتوي ملفات pnpm الأساسية في المجلد الرئيسي."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.8.1 --activate
          pnpm --version

      - name: Install dependencies
        shell: pwsh
        run: |
          Push-Location source
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Build Windows installer
        shell: pwsh
        run: |
          Push-Location source
          pnpm --filter @workspace/makhzani-pos run desktop:dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Makhzani-POS-Windows-Installer
          path: source/artifacts/makhzani-pos/release/*.exe
          if-no-files-found: error
          retention-days: 14
