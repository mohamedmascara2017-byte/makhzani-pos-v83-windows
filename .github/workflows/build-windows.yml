

name: Build Makhzani POS V8.6 for Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project
        shell: pwsh
        run: |
          if (!(Test-Path "package.json")) {
            throw "package.json missing from repository root"
          }
          if (!(Test-Path "pnpm-workspace.yaml")) {
            throw "pnpm-workspace.yaml missing"
          }
          if (!(Test-Path "artifacts/makhzani-pos/package.json")) {
            throw "Makhzani POS package missing"
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.8.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Windows
        run: pnpm --filter @workspace/makhzani-pos run desktop:dist

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Makhzani-POS-V8.6-Windows-Installer
          path: artifacts/makhzani-pos/release/*.exe
          if-no-files-found: error
