
name: Build Makhzani POS V8.6 Windows Updated

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract updated V8.6 source
        shell: pwsh
        run: |
          $zip = "Makhzani_POS_V8_6_Shortcuts_Empty_Update.zip"

          if (!(Test-Path $zip)) {
            throw "Updated source ZIP not found: $zip"
          }

          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP/makhzani-source" -Force

          Copy-Item "$env:RUNNER_TEMP/makhzani-source/*" "." -Recurse -Force

          if (!(Test-Path "package.json")) {
            throw "package.json missing after extraction"
          }

          if (!(Test-Path "pnpm-workspace.yaml")) {
            throw "pnpm-workspace.yaml missing"
          }

          if (!(Test-Path "artifacts/makhzani-pos/package.json")) {
            throw "POS application package.json missing"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.8.1 --activate
          pnpm --version

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --no-frozen-lockfile

      - name: Build Windows installer
        shell: pwsh
        run: pnpm --filter @workspace/makhzani-pos run desktop:dist

      - name: Verify installer
        shell: pwsh
        run: |
          $files = Get-ChildItem "artifacts/makhzani-pos/release" -Filter "*.exe" -ErrorAction SilentlyContinue

          if (!$files -or $files.Count -eq 0) {
            throw "Windows installer was not generated"
          }

          $files | ForEach-Object {
            Write-Host "Installer found: $($_.FullName)"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Makhzani-POS-V8.6-Updated-Windows
          path: artifacts/makhzani-pos/release/*.exe
          if-no-files-found: error
          retention-days: 14
